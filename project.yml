name: VoxlPocket
options:
  bundleIdPrefix: com.ericmigi
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    DEVELOPMENT_TEAM: 2KK9392YQN
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "2"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  VoxlPocket:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: Voxl
        # Kept from the first builds so installed copies keep their hosts and Keychain items.
        PRODUCT_BUNDLE_IDENTIFIER: com.ericmigi.Voxl
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Voxl Pocket
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Voxl Pocket connects to computers on your local network that run the voxl server.
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UIApplicationSupportsIndirectInputEvents: true
        UIStatusBarHidden: true
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
