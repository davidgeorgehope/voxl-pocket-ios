name: VoxlPocket
options:
  bundleIdPrefix: com.davidhope
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    DEVELOPMENT_TEAM: 4P2629648N
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "0.2"
    CURRENT_PROJECT_VERSION: "2"
targets:
  VoxlPocket:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - sdk: GameController.framework
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: Voxl
        SWIFT_OBJC_BRIDGING_HEADER: Sources/VoxlPocket-Bridging-Header.h
        # Kept from the first builds so installed copies keep their hosts and Keychain items.
        PRODUCT_BUNDLE_IDENTIFIER: com.davidhope.voxlpocket
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Voxl Pocket
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Voxl Pocket connects to computers on your local network that run the voxl server.
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UIApplicationSupportsIndirectInputEvents: true
        UIStatusBarHidden: true
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
            UIWindowSceneSessionRoleExternalDisplayNonInteractive:
              - UISceneConfigurationName: External
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).ExternalSceneDelegate
